    .zone-green-gold:hover { background: #d4a847; color: #050a08; box-shadow: 0 0 40px rgba(212,168,71,0.6); }

      border: 3px solid #d4a847; background: transparent; color: #d4a847;
      font-family: 'Press Start 2P', monospace; font-size: 10px;

      text-transform: uppercase; letter-spacing: 1.5px;

    .pixel-text-muted { font-family: 'VT323', monospace; color: #008855; font-size: 18px; text-shadow: 0 0 10px rgba(0,136,85,0.2); }
