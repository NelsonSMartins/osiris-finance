<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OSIRIS · Controle Financeiro</title>

  <!-- Google Fonts com foco em acessibilidade -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Atkinson Hyperlegible - fonte desenvolvida para dislexia -->
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* ============================================
       OSIRIS MODERNO - ACESSIBILIDADE OTIMIZADA
       Contraste WCAG AA+ / Fonte para dislexia
       ============================================ */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* Cores com contraste melhorado */
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-card: #1a2332;
      --bg-card-hover: #243044;
      --bg-input: #0d1520;
      --text-primary: #f0f4f8;
      --text-secondary: #c8d6e5;
      --text-muted: #94a3b8;
      --border-color: #2d3a4a;
      --accent: #10b981;
      --accent-dark: #059669;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #8b5cf6;
      --blue: #3b82f6;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-display: 'Space Grotesk', 'Atkinson Hyperlegible', 'Inter', sans-serif;
      --font-body: 'Atkinson Hyperlegible', 'Inter', sans-serif;
      --letter-spacing: 0.02em;
      --line-height: 1.7;
    }

    [data-theme="light"] {
      --bg-primary: #f0f2f5;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f3f5;
      --bg-input: #f8f9fa;
      --text-primary: #0a0e1a;
      --text-secondary: #1e293b;
      --text-muted: #475569;
      --border-color: #d1d5db;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      --accent: #059669;
      --accent-dark: #047857;
    }

    /* ===== TEMA PIXEL 90 (contraste melhorado) ===== */
    [data-theme="pixel"] {
      --bg-primary: #0a0e0a;
      --bg-secondary: #111811;
      --bg-card: #0d1520;
      --bg-card-hover: #1a2332;
      --bg-input: #050a08;
      --text-primary: #00ff88;
      --text-secondary: #66ffbb;
      --text-muted: #00cc77;
      --border-color: #00ff88;
      --accent: #00ff88;
      --accent-dark: #00cc66;
      --accent-glow: rgba(0, 255, 136, 0.2);
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      --radius: 4px;
      --font-body: 'VT323', 'Atkinson Hyperlegible', monospace;
      --font-display: 'Press Start 2P', 'Atkinson Hyperlegible', monospace;
      --letter-spacing: 0.04em;
      --line-height: 1.6;
    }

    body {
      font-family: var(--font-body);
      letter-spacing: var(--letter-spacing);
      line-height: var(--line-height);
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: var(--transition);
      min-height: 100vh;
    }

    /* ===== FONTE PARA DISLEXIA ===== */
    .font-dyslexic {
      font-family: 'Atkinson Hyperlegible', 'Inter', sans-serif;
      letter-spacing: 0.04em;
      word-spacing: 0.08em;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; }

    /* ===== GLASSMORPHISM ===== */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    /* ===== CARDS ===== */
    .card-modern {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 20px;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }
    .card-modern:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    /* ===== BUTTONS ===== */
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-body);
      font-size: 15px;
      letter-spacing: 0.04em;
    }
    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px var(--accent-glow);
    }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: var(--transition);
      min-height: 48px;
      font-family: var(--font-body);
      font-size: 15px;
      letter-spacing: 0.04em;
    }
    .btn-secondary:hover {
      background: var(--bg-card-hover);
    }

    /* ===== INPUTS COM CONTRASTE MELHORADO ===== */
    .input-modern {
      background: var(--bg-input);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      width: 100%;
      min-height: 48px;
      transition: var(--transition);
      font-family: var(--font-body);
      font-size: 16px;
      letter-spacing: 0.04em;
    }
    .input-modern:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }
    .input-modern::placeholder {
      color: var(--text-muted);
      opacity: 0.8;
    }

    /* ===== SELECT ===== */
    .select-modern {
      background: var(--bg-input);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      width: 100%;
      min-height: 48px;
      transition: var(--transition);
      appearance: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 16px;
      letter-spacing: 0.04em;
    }
    .select-modern:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }
    .select-modern option {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    /* ===== NAV ===== */
    .nav-modern {
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      flex: 1;
      padding: 8px 4px;
      color: var(--text-muted);
      transition: var(--transition);
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      position: relative;
    }
    .nav-item.active {
      color: var(--accent);
    }
    .nav-item.active::after {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      background: var(--accent);
      border-radius: 0 0 4px 4px;
    }
    .nav-item:hover {
      color: var(--text-primary);
    }
    .nav-item .icon {
      font-size: 18px;
      margin-bottom: 2px;
    }

    /* ===== STATS ===== */
    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 16px 20px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      border-radius: 0 0 4px 4px;
    }
    .stat-card.revenue::before { background: linear-gradient(90deg, #10b981, #34d399); }
    .stat-card.expense::before { background: linear-gradient(90deg, #ef4444, #f87171); }
    .stat-card.balance::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }

    /* ===== ANIMAÇÕES ===== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
      50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px rgba(16, 185, 129, 0.08); }
    }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

    @keyframes fillBar {
      from { width: 0%; }
    }
    @keyframes floatUp {
      0% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0); }
    }
    .float-badge { animation: floatUp 2.4s ease-in-out infinite; }

    /* ===== CATEGORY BADGE ===== */
    .badge-income {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-expense {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    /* ===== METAS ===== */
    .progress-track {
      width: 100%;
      height: 16px;
      background: var(--bg-input);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border-color);
    }
    .progress-fill {
      height: 100%;
      border-radius: 20px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fillBar 1s ease-out;
      background: linear-gradient(90deg, var(--accent), #34d399);
      position: relative;
    }
    .progress-fill.milestone-100 {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
    }
    .progress-ticks {
      position: absolute;
      inset: 0;
      display: flex;
      pointer-events: none;
    }
    .progress-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(255,255,255,0.2);
    }
    .level-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .streak-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(239,68,68,0.1));
      border: 1px solid rgba(245,158,11,0.4);
      color: var(--warning);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }
    .goal-icon-circle {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .subtab-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font-body);
      letter-spacing: 0.04em;
    }
    .subtab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .emoji-pick {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .emoji-pick.selected {
      border-color: var(--accent);
      background: var(--accent-glow);
    }
    .insight-card {
      background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(139,92,246,0.06));
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .font-display { font-family: var(--font-display); }
    .font-body { font-family: var(--font-body); }

    /* ===== RESPONSIVO ===== */
    @media (max-width: 640px) {
      .stat-card { padding: 12px 16px; }
      .btn-primary { padding: 10px 18px; font-size: 13px; }
      .nav-item { font-size: 9px; min-height: 56px; }
      .input-modern { font-size: 15px; }
      .select-modern { font-size: 15px; }
    }

    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>

<div id="root"></div>

<!-- ========== CDN ========== -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
(function() {
  'use strict';

  // ============================================
  // SUPABASE
  // ============================================
  var SUPABASE_URL = 'https://nzyqhqxfpvzljcunnnsq.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_vSSbaS4QS-mp0pbFb4cr3g_0edR7d97';
  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var React = window.React;
  var ReactDOM = window.ReactDOM;
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useMemo = React.useMemo;
  var useRef = React.useRef;
  var createElement = React.createElement;

  // ============================================
  // UTILITÁRIOS COM FORMATTAÇÃO
  // ============================================

  // Formatar valor para moeda BR
  function formatCurrency(v) {
    if (v === undefined || v === null || isNaN(v)) v = 0;
    return new Intl.NumberFormat('pt-BR', {
      style: 'currency',
      currency: 'BRL',
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(v);
  }

  // Converter string para número (ex: "1.234,56" → 1234.56)
  function parseCurrency(str) {
    if (!str) return 0;
    var clean = str.replace(/[R$\s]/g, '').replace(/\./g, '').replace(/,/g, '.');
    var num = parseFloat(clean);
    return isNaN(num) ? 0 : num;
  }

  // Máscara de valor monetário para input
  function maskCurrency(value) {
    if (!value) return '';
    var num = parseCurrency(value);
    if (num === 0) return '';
    return formatCurrency(num);
  }

  // Formatar data para exibição
  function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
      var d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    } catch (e) { return dateStr; }
  }

  function getMonthRange(date) {
    var start = new Date(date.getFullYear(), date.getMonth(), 1).toISOString().split('T')[0];
    var end = new Date(date.getFullYear(), date.getMonth() + 1, 0).toISOString().split('T')[0];
    return { start: start, end: end };
  }

  function getPrevMonthDate(date) {
    var d = new Date(date);
    d.setMonth(d.getMonth() - 1);
    return d;
  }

  function getTheme() {
    return document.documentElement.getAttribute('data-theme') || 'dark';
  }

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('osiris-theme', theme);
  }

  function monthKey(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function computeMonthlyAverage(economias) {
    var map = {};
    economias.forEach(function(e) {
      var k = monthKey(e.data);
      map[k] = (map[k] || 0) + Number(e.valor);
    });
    var keys = Object.keys(map);
    if (keys.length === 0) return 0;
    var total = keys.reduce(function(acc, k) { return acc + map[k]; }, 0);
    return total / keys.length;
  }

  function computeStreak(economias) {
    var map = {};
    economias.forEach(function(e) { map[monthKey(e.data)] = true; });
    var streak = 0;
    var cursor = new Date();
    while (true) {
      var k = cursor.getFullYear() + '-' + String(cursor.getMonth() + 1).padStart(2, '0');
      if (map[k]) { streak++; cursor.setMonth(cursor.getMonth() - 1); }
      else break;
    }
    return streak;
  }

  function levelInfo(pct) {
    if (pct >= 100) return { label: 'Conquistado', emoji: '🏆', color: '#f59e0b' };
    if (pct >= 75) return { label: 'Reta Final', emoji: '💪', color: '#8b5cf6' };
    if (pct >= 50) return { label: 'Quase Lá', emoji: '🔥', color: '#10b981' };
    if (pct >= 25) return { label: 'Em Progresso', emoji: '🚀', color: '#3b82f6' };
    return { label: 'Iniciante', emoji: '🌱', color: '#64748b' };
  }

  function predictGoal(objetivo, economiasDoObjetivo) {
    var total = economiasDoObjetivo.reduce(function(acc, e) { return acc + Number(e.valor); }, 0);
    var alvo = Number(objetivo.valor_alvo) || 0;
    var restante = Math.max(alvo - total, 0);
    var mediaMensal = computeMonthlyAverage(economiasDoObjetivo);
    var pct = alvo > 0 ? Math.min((total / alvo) * 100, 100) : 0;
    var mesesRestantes = null;
    var dataPrevista = null;
    if (restante <= 0) {
      mesesRestantes = 0;
    } else if (mediaMensal > 0) {
      mesesRestantes = Math.ceil(restante / mediaMensal);
      var d = new Date();
      d.setMonth(d.getMonth() + mesesRestantes);
      dataPrevista = d;
    }
    return { total: total, restante: restante, mediaMensal: mediaMensal, pct: pct, mesesRestantes: mesesRestantes, dataPrevista: dataPrevista };
  }

  var EMOJI_OPTIONS = ['🎯', '🏠', '🚗', '✈️', '🎓', '💍', '📱', '🏖️', '💻', '🧳', '🏡', '🌍', '🎸', '📚', '🎮'];

  // ============================================
  // COMPONENTES DE UI
  // ============================================

  function ProgressBar(props) {
    var pct = Math.max(0, Math.min(props.pct || 0, 100));
    return createElement(
      'div',
      { className: 'progress-track' },
      createElement('div', {
        className: 'progress-fill' + (pct >= 100 ? ' milestone-100' : ''),
        style: { width: pct + '%' }
      }),
      createElement(
        'div',
        { className: 'progress-ticks' },
        [25, 50, 75].map(function(t) {
          return createElement('div', { key: t, className: 'progress-tick', style: { left: t + '%' } });
        })
      )
    );
  }

  // ----- Input com máscara de valor -----
  function CurrencyInput(props) {
    var value = props.value || '';
    var onChange = props.onChange;
    var placeholder = props.placeholder || '0,00';
    var className = props.className || 'input-modern';
    var required = props.required || false;

    var handleChange = function(e) {
      var raw = e.target.value;
      // Remove tudo que não é número ou vírgula
      var cleaned = raw.replace(/[^0-9,]/g, '');
      onChange(cleaned);
    };

    var handleBlur = function(e) {
      var val = e.target.value;
      if (val) {
        var num = parseCurrency(val);
        if (num > 0) {
          onChange(formatCurrency(num));
        }
      }
    };

    return createElement('input', {
      type: 'text',
      inputMode: 'decimal',
      placeholder: placeholder,
      value: value,
      onChange: handleChange,
      onBlur: handleBlur,
      className: className,
      required: required
    });
  }

  // ----- Header -----
  function Header(props) {
    var currentDate = props.currentDate, onDateChange = props.onDateChange;
    return createElement(
      'header',
      { className: 'sticky top-0 z-40 bg-[var(--bg-primary)]/95 backdrop-blur border-b border-[var(--border-color)] px-4 py-3' },
      createElement(
        'div',
        { className: 'max-w-md mx-auto flex items-center justify-between' },
        createElement(
          'div',
          { className: 'flex items-center gap-3' },
          createElement(
            'div',
            { className: 'w-8 h-8 rounded-xl bg-gradient-to-br from-[#10b981] to-[#059669] flex items-center justify-center text-white font-bold text-sm font-display' },
            'O'
          ),
          createElement('span', { className: 'text-lg font-bold tracking-tight font-display' }, 'OSIRIS')
        ),
        onDateChange ? createElement(
          'div',
          { className: 'flex items-center gap-1' },
          createElement('button', {
            onClick: function() { onDateChange('prev'); },
