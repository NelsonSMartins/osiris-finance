  function formatCurrency(v) {
    if (v === undefined || v === null || isNaN(v)) v = 0;
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
  }

  function parseCurrency(str) {
    if (!str) return 0;
    var clean = str.replace(/[R$\s]/g, '').replace(/\./g, '').replace(/,/g, '.');
    var num = parseFloat(clean);
    return isNaN(num) ? 0 : num;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
      var d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });

  }

  function getMonthRange(date) {
    var start = new Date(date.getFullYear(), date.getMonth(), 1).toISOString().split('T')[0];
    var end = new Date(date.getFullYear(), date.getMonth() + 1, 0).toISOString().split('T')[0];
    return { start: start, end: end };
  }

  function monthKey(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  // ============================================
  // ALGORITMOS PREDITIVOS E GAMIFICADOS
  // ============================================
  function computeMonthlyAverage(economias) {
    var map = {};
    economias.forEach(function(e) {
      var k = monthKey(e.data);
      map[k] = (map[k] || 0) + Number(e.valor);
    });
    var keys = Object.keys(map);
    if (keys.length === 0) return 0;
    var total = keys.reduce(function(acc, k) { return acc + map[k]; }, 0);
    return total / keys.length;
  }

  function computeStreak(economias) {
    var map = {};
    economias.forEach(function(e) { map[monthKey(e.data)] = true; });
    var streak = 0;
    var cursor = new Date();
    while (true) {
      var k = cursor.getFullYear() + '-' + String(cursor.getMonth() + 1).padStart(2, '0');
      if (map[k]) { streak++; cursor.setMonth(cursor.getMonth() - 1); }
      else break;
    }
    return streak;
  }

  function levelInfo(pct) {
    if (pct >= 100) return { label: '🏆 Conquistador', icon: 'fa-trophy', color: '#f59e0b' };
    if (pct >= 75) return { label: '🔥 Reta Final', icon: 'fa-dumbbell', color: '#8b5cf6' };

  }

  function predictGoal(objetivo, economiasDoObjetivo) {
    var total = economiasDoObjetivo.reduce(function(acc, e) { return acc + Number(e.valor); }, 0);
    var alvo = Number(objetivo.valor_alvo) || 0;
    var restante = Math.max(alvo - total, 0);
    var mediaMensal = computeMonthlyAverage(economiasDoObjetivo);
    var pct = alvo > 0 ? Math.min((total / alvo) * 100, 100) : 0;
    var mesesRestantes = null;
    var dataPrevista = null;
    if (restante <= 0) {
      mesesRestantes = 0;
    } else if (mediaMensal > 0) {
      mesesRestantes = Math.ceil(restante / mediaMensal);
      var d = new Date();
      d.setMonth(d.getMonth() + mesesRestantes);
      dataPrevista = d;
    }
    return { total: total, restante: restante, mediaMensal: mediaMensal, pct: pct, mesesRestantes: mesesRestantes, dataPrevista: dataPrevista };
  }

    var value = props.value || '';

    var required = props.required || false;

    var formatRealTime = function(raw) {
      var num = raw.replace(/\D/g, '');
      if (num === '') return '';
      var intNum = parseInt(num, 10);
      if (isNaN(intNum)) return '';
      var floatNum = intNum / 100;
      return floatNum.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    var handleChange = function(e) {
      var raw = e.target.value;
      var clean = raw.replace(/\D/g, '');
      var formatted = formatRealTime(clean);
      onChange(formatted);
    };

    return createElement('input', {
      type: 'text',
      inputMode: 'decimal',
      placeholder: placeholder,
      value: value,
      onChange: handleChange,
      className: className,
      required: required
    });
  }

    var handleGoogle = function() {

  function formatCurrency(v) {

    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
  }

  function parseCurrency(str) {
    if (!str) return 0;
    var clean = str.replace(/[R$\s]/g, '').replace(/\./g, '').replace(/,/g, '.');
    var num = parseFloat(clean);
    return isNaN(num) ? 0 : num;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    try {
      var d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    } catch (e) { return dateStr; }
  }

  function getMonthRange(date) {
    var start = new Date(date.getFullYear(), date.getMonth(), 1).toISOString().split('T')[0];
    var end = new Date(date.getFullYear(), date.getMonth() + 1, 0).toISOString().split('T')[0];
    return { start: start, end: end };
  }

  function monthKey(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  // ============================================
  // ALGORITMOS PREDITIVOS E GAMIFICADOS
  // ============================================
  function computeMonthlyAverage(economias) {
    var map = {};
    economias.forEach(function(e) {
      var k = monthKey(e.data);
      map[k] = (map[k] || 0) + Number(e.valor);
    });
    var keys = Object.keys(map);
    if (keys.length === 0) return 0;
    var total = keys.reduce(function(acc, k) { return acc + map[k]; }, 0);
    return total / keys.length;
  }

  function computeStreak(economias) {
    var map = {};
    economias.forEach(function(e) { map[monthKey(e.data)] = true; });
    var streak = 0;
    var cursor = new Date();
    while (true) {
      var k = cursor.getFullYear() + '-' + String(cursor.getMonth() + 1).padStart(2, '0');
      if (map[k]) { streak++; cursor.setMonth(cursor.getMonth() - 1); }
      else break;
    }
    return streak;
  }

  function levelInfo(pct) {
    if (pct >= 100) return { label: '🏆 Conquistador', icon: 'fa-trophy', color: '#f59e0b' };

  }

  function predictGoal(objetivo, economiasDoObjetivo) {
    var total = economiasDoObjetivo.reduce(function(acc, e) { return acc + Number(e.valor); }, 0);
    var alvo = Number(objetivo.valor_alvo) || 0;
    var restante = Math.max(alvo - total, 0);
    var mediaMensal = computeMonthlyAverage(economiasDoObjetivo);
    var pct = alvo > 0 ? Math.min((total / alvo) * 100, 100) : 0;
    var mesesRestantes = null;
    var dataPrevista = null;
    if (restante <= 0) {

    } else if (mediaMensal > 0) {
      mesesRestantes = Math.ceil(restante / mediaMensal);
      var d = new Date();
      d.setMonth(d.getMonth() + mesesRestantes);

    }

  }

      var floatNum = intNum / 100;
