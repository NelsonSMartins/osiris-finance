<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OSIRIS · Controle Financeiro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    [data-theme="dark"] {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-card: #1a2332;
      --bg-card-hover: #243044;
      --bg-input: #0d1520;
      --text-primary: #e8edf5;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #2d3a4a;
      --accent: #10b981;
      --accent-dark: #059669;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #8b5cf6;
      --blue: #3b82f6;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      --radius: 16px;
      --font-display: 'Space Grotesk', 'Atkinson Hyperlegible', 'Inter', sans-serif;
      --font-body: 'Atkinson Hyperlegible', 'Inter', sans-serif;
    }

    [data-theme="light"] {
      --bg-primary: #f0f2f5;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f3f5;
      --bg-input: #f8f9fa;
      --text-primary: #0a0e1a;
      --text-secondary: #1e293b;
      --text-muted: #475569;
      --border-color: #d1d5db;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      --accent: #059669;
      --accent-dark: #047857;
      --radius: 16px;
    }

    [data-theme="pixel"] {
      --bg-primary: #0a0e0a;
      --bg-secondary: #111811;
      --bg-card: #0d1520;
      --bg-card-hover: #1a2332;
      --bg-input: #050a08;
      --text-primary: #00ff88;
      --text-secondary: #66ffbb;
      --text-muted: #00cc77;
      --border-color: #00ff88;
      --accent: #00ff88;
      --accent-dark: #00cc66;
      --accent-glow: rgba(0, 255, 136, 0.2);
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      --radius: 4px;
      --font-display: 'Press Start 2P', 'Atkinson Hyperlegible', monospace;
      --font-body: 'VT323', 'Atkinson Hyperlegible', monospace;
    }

    [data-theme="rose"] {
      --bg-primary: #1a0a14;
      --bg-secondary: #2d1524;
      --bg-card: #3d1a30;
      --bg-card-hover: #4d2440;
      --bg-input: #1a0a14;
      --text-primary: #fce4ec;
      --text-secondary: #f8bbd0;
      --text-muted: #f06292;
      --border-color: #5c2a4a;
      --accent: #f472b6;
      --accent-dark: #ec4899;
      --accent-glow: rgba(244, 114, 182, 0.25);
      --danger: #f44336;
      --warning: #f59e0b;
      --purple: #a78bfa;
      --blue: #60a5fa;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      --radius: 16px;
      --font-display: 'Space Grotesk', 'Atkinson Hyperlegible', 'Inter', sans-serif;
      --font-body: 'Atkinson Hyperlegible', 'Inter', sans-serif;
    }

    [data-theme="gold"] {
      --bg-primary: #1a1208;
      --bg-secondary: #2d2010;
      --bg-card: #3d2a18;
      --bg-card-hover: #4d3420;
      --bg-input: #1a1208;
      --text-primary: #fef3c7;
      --text-secondary: #fde68a;
      --text-muted: #d4a847;
      --border-color: #5c4420;
      --accent: #d4a847;
      --accent-dark: #b8922f;
      --accent-glow: rgba(212, 168, 71, 0.25);
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #a78bfa;
      --blue: #60a5fa;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      --radius: 16px;
      --font-display: 'Space Grotesk', 'Atkinson Hyperlegible', 'Inter', sans-serif;
      --font-body: 'Atkinson Hyperlegible', 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 100vh;
      letter-spacing: 0.02em;
      line-height: 1.7;
    }

    .font-display { font-family: var(--font-display); }
    .font-body { font-family: var(--font-body); }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; }

    .card-modern {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 20px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow);
    }
    .card-modern:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-body);
      font-size: 15px;
    }
    .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 30px var(--accent-glow); }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 48px;
      font-family: var(--font-body);
      font-size: 15px;
    }
    .btn-secondary:hover { background: var(--bg-card-hover); }

    .input-modern {
      background: var(--bg-input);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      width: 100%;
      min-height: 48px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: var(--font-body);
      font-size: 16px;
    }
    .input-modern:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
    .input-modern::placeholder { color: var(--text-muted); opacity: 0.8; }

    .select-modern {
      background: var(--bg-input);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      width: 100%;
      min-height: 48px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      appearance: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 16px;
    }
    .select-modern:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
    .select-modern option { background: var(--bg-card); color: var(--text-primary); }

    .nav-modern {
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      flex: 1;
      padding: 8px 4px;
      color: var(--text-muted);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      position: relative;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item.active::after {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      background: var(--accent);
      border-radius: 0 0 4px 4px;
    }
    .nav-item:hover { color: var(--text-primary); }
    .nav-item .icon { font-size: 18px; margin-bottom: 2px; }

    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 16px 20px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      border-radius: 0 0 4px 4px;
    }
    .stat-card.revenue::before { background: linear-gradient(90deg, #10b981, #34d399); }
    .stat-card.expense::before { background: linear-gradient(90deg, #ef4444, #f87171); }
    .stat-card.balance::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }

    @keyframes floatUp {
      0% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0); }
    }
    .float-badge { animation: floatUp 2.4s ease-in-out infinite; }

    .checkbox-modern {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      border: 2px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: var(--font-body);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab-btn.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }

    .pendencia-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pendencia-item:hover { border-color: var(--accent); }
    .pendencia-item.pago { opacity: 0.55; }
    .pendencia-item.pago .pendencia-nome { text-decoration: line-through; color: var(--text-muted); }

    .theme-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      background: var(--bg-input);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
      font-family: var(--font-body);
      color: var(--text-primary);
    }
    .theme-option:hover { border-color: var(--accent); }
    .theme-option.active { border-color: var(--accent); background: var(--accent-glow); }
    .theme-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      flex-shrink: 0;
    }
    .theme-dot.dark { background: #0a0e1a; }
    .theme-dot.light { background: #f0f2f5; border-color: #d1d5db; }
    .theme-dot.pixel { background: #00ff88; }
    .theme-dot.rose { background: #f472b6; }
    .theme-dot.gold { background: #d4a847; }

    .badge-default {
      background: var(--accent);
      color: #ffffff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .goal-icon-circle {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .subtab-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: var(--font-body);
    }
    .subtab-btn.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }

    .emoji-pick {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .emoji-pick.selected { border-color: var(--accent); background: var(--accent-glow); }

    .insight-card {
      background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(139,92,246,0.06));
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 18px 20px;
    }

    .level-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .streak-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(239,68,68,0.1));
      border: 1px solid rgba(245,158,11,0.4);
      color: var(--warning);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
    }

    .progress-track {
      width: 100%;
      height: 16px;
      background: var(--bg-input);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border-color);
    }
    .progress-fill {
      height: 100%;
      border-radius: 20px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      position: relative;
    }
    .progress-fill.milestone-100 { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .progress-ticks { position: absolute; inset: 0; display: flex; pointer-events: none; }
    .progress-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(255,255,255,0.2);
    }

    .extrato-scroll {
      max-height: 400px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .extrato-scroll::-webkit-scrollbar { width: 4px; }
    .extrato-scroll::-webkit-scrollbar-track { background: var(--bg-input); border-radius: 4px; }
    .extrato-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

    .resumo-card {
      padding: 12px 16px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .resumo-card.pago { border-color: rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.05); }
    .resumo-card.pendente { border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.05); }

    @media (max-width: 640px) {
      .stat-card { padding: 12px 16px; }
      .btn-primary { padding: 10px 18px; font-size: 13px; }
      .nav-item { font-size: 9px; min-height: 56px; }
      .input-modern { font-size: 15px; }
      .select-modern { font-size: 15px; }
      .tab-btn { font-size: 11px; padding: 8px 10px; }
    }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

    /* =========================================
       ESTILOS DA TELA DE LOGIN (Cores da sua Logo)
       ========================================= */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      padding: 20px;
    }
    .login-card-custom {
      background: #0a0e0a;
      padding: 40px 30px;
      border-radius: 20px;
      border: 2px solid #10b981;
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.15);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .login-logo-box {
      margin-bottom: 30px;
    }
    .login-logo-box img {
      width: 100%;
      max-width: 220px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 50%;
      border: 4px solid #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    }
    .login-title-custom {
      color: #d4af37;
      margin-bottom: 25px;
      letter-spacing: 2px;
      font-weight: 700;
      font-family: var(--font-display);
    }
    .login-input-custom {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #10b981;
      background: #1a1a1a;
      color: #fff;
      outline: none;
      font-size: 16px;
      margin-bottom: 15px;
    }
    .login-input-custom:focus {
      border-color: #d4af37;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
    }
    .login-btn-custom {
      width: 100%;
      padding: 14px;
      background: #10b981;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
      font-family: var(--font-body);
    }
    .login-btn-custom:hover {
      background: #059669;
      box-shadow: 0 0 15px #10b981;
      transform: scale(1.02);
    }
    .login-google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #d4af37;
      background: transparent;
      color: #d4af37;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 15px;
    }
    .login-google-btn:hover {
      background: #d4af37;
      color: #000;
    }
    .login-error-msg {
      color: #ef4444;
      font-size: 14px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .login-success-msg {
      color: #10b981;
      font-size: 14px;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .login-toggle-text {
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
      background: transparent;
      border: none;
      margin-top: 10px;
    }
    .login-toggle-text:hover {
      color: #10b981;
    }
  </style>
</head>
