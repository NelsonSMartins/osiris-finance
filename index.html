<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSIRIS · Redirecionando</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var route = path.replace('/osiris-finance', '').replace('/index.html', '');
      if (route === '' || route === '/') {
        window.location.replace('/osiris-finance/');
        return;
      }
      var newUrl = '/osiris-finance/' + route;
      newUrl = newUrl.replace(/\/{2,}/g, '/');
      window.location.replace(newUrl);
    })();
  </script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#050a08;color:#00ff88;font-family:monospace;">
  <div style="text-align:center;border:4px solid #00ff88;padding:40px;">
    <h1 style="font-size:24px;">🏛️ OSIRIS</h1>
    <p style="color:#008855;">Redirecionando para a página correta...</p>
    <p style="font-size:12px;margin-top:20px;">
      Se não redirecionar, <a href="/osiris-finance/" style="color:#d4a847;">clique aqui</a>
    </p>
  </div>
</body>
</html>
