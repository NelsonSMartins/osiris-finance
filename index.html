  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* ============================================
       OSIRIS MODERNO - TEMA DARK/LIGHT
       ============================================ */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-card: #1a2332;
      --bg-card-hover: #243044;
      --bg-input: #0d1520;
      --text-primary: #e8edf5;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #2d3a4a;
      --accent: #10b981;
      --accent-dark: #059669;
      --accent-glow: rgba(16, 185, 129, 0.3);
      --danger: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg-primary: #f0f2f5;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f8f9fa;
      --bg-input: #ffffff;
      --text-primary: #0a0e1a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    /* ===== TEMA PIXEL 90 ===== */
    [data-theme="pixel"] {
      --bg-primary: #050a08;
      --bg-secondary: #0d1520;
      --bg-card: #0d1520;
      --bg-card-hover: #1a2332;
      --bg-input: #050a08;
      --text-primary: #00ff88;
      --text-secondary: #008855;
      --text-muted: #006644;
      --border-color: #00ff88;
      --accent: #00ff88;
      --accent-dark: #00cc66;
      --accent-glow: rgba(0, 255, 136, 0.2);
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      --radius: 4px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: var(--transition);
      min-height: 100vh;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; }

    /* ===== GLASSMORPHISM ===== */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .glass-light {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ===== CARDS ===== */
    .card-modern {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 20px;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }
    .card-modern:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    /* ===== BUTTONS ===== */
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: var(--transition);
      min-height: 48px;
    }
    .btn-secondary:hover {
      background: var(--bg-card-hover);
    }

    /* ===== INPUTS ===== */
    .input-modern {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      width: 100%;
      min-height: 48px;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
    }
    .input-modern:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* ===== SELECT ===== */
    .select-modern {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      width: 100%;
      min-height: 48px;
      transition: var(--transition);
      appearance: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .select-modern:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .select-modern option {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    /* ===== NAV ===== */
    .nav-modern {
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      min-width: 64px;
      padding: 8px 12px;
      color: var(--text-muted);
      transition: var(--transition);
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: relative;
    }
    .nav-item.active {
      color: var(--accent);
    }
    .nav-item.active::after {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      background: var(--accent);
      border-radius: 0 0 4px 4px;
    }
    .nav-item:hover {
      color: var(--text-primary);
    }
    .nav-item .icon {
      font-size: 20px;
      margin-bottom: 2px;
    }

    /* ===== STATS ===== */
    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 16px 20px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 0 0 4px 4px;
    }
    .stat-card.revenue::before { background: linear-gradient(90deg, #10b981, #34d399); }
    .stat-card.expense::before { background: linear-gradient(90deg, #ef4444, #f87171); }
    .stat-card.balance::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }

    /* ===== ANIMAÇÕES ===== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up {
      animation: fadeInUp 0.4s ease-out forwards;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
      50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px rgba(16, 185, 129, 0.1); }
    }
    .pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    /* ===== CATEGORY BADGE ===== */
    .badge-income {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
    }
    .badge-expense {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
    }

    /* ===== RESPONSIVO ===== */
    @media (max-width: 640px) {
      .stat-card { padding: 12px 16px; }
      .btn-primary { padding: 10px 18px; font-size: 13px; }
      .nav-item { font-size: 9px; min-height: 56px; }
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
