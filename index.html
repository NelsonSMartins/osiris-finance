  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* ============================================
       OSIRIS RETRÔ 90s - ULTRA HD
       Preto + Verde Esmeralda + Dourado
       ============================================ */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Press Start 2P', 'VT323', monospace;
      background: #0a0e0a;
      color: #00ff88;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ===== EFEITO CRT (TELA DE TUBO) ===== */
    .crt-effect {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 9999;
    }
    .crt-effect::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.1) 0px,
          rgba(0, 0, 0, 0.1) 2px,
          transparent 2px,
          transparent 4px
        );
    }
    .crt-effect::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.6) 100%);
    }

    /* ===== SCROLLBAR PIXEL ===== */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0e0a; border: 2px solid #00ff88; }
    ::-webkit-scrollbar-thumb { background: #d4a847; border: 2px solid #0a0e0a; }

    /* ===== PIXEL BORDERS ===== */
    .pixel-border {
      border: 4px solid #00ff88;
      box-shadow: 
        inset 0 0 0 2px #0a0e0a,
        0 0 0 2px #00ff88,
        4px 4px 0 0 rgba(0, 255, 136, 0.2);
    }

    .pixel-border-gold {
      border: 4px solid #d4a847;
      box-shadow: 
        inset 0 0 0 2px #0a0e0a,
        0 0 0 2px #d4a847,
        4px 4px 0 0 rgba(212, 168, 71, 0.2);
    }

    .pixel-border-glow {
      border: 4px solid #00ff88;
      box-shadow: 
        inset 0 0 0 2px #0a0e0a,
        0 0 20px rgba(0, 255, 136, 0.3),
        0 0 60px rgba(0, 255, 136, 0.1);
    }

    .pixel-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      background: transparent;
      color: #00ff88;
      border: 4px solid #00ff88;
      padding: 12px 24px;
      cursor: pointer;
      transition: all 0.15s ease;
      image-rendering: pixelated;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
      min-height: 48px;
    }
    .pixel-btn:hover {
      background: #00ff88;
      color: #0a0e0a;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
      transform: scale(1.02);
    }
    .pixel-btn:active { transform: scale(0.95); }
    .pixel-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .pixel-btn-gold {
      border-color: #d4a847;
      color: #d4a847;
    }
    .pixel-btn-gold:hover {
      background: #d4a847;
      color: #0a0e0a;
      box-shadow: 0 0 30px rgba(212, 168, 71, 0.4);
    }

      font-family: 'VT323', monospace;
      font-size: 20px;
      background: #0a0e0a;
      color: #00ff88;
      border: 4px solid #00ff88;
      padding: 12px 16px;
      outline: none;
      image-rendering: pixelated;
      width: 100%;
      letter-spacing: 1px;
      min-height: 52px;
    }
    .pixel-input:focus {
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }
    .pixel-input::placeholder {
      color: #006644;
      font-size: 16px;
    }

    .pixel-input-gold {
      border-color: #d4a847;
    }
    .pixel-input-gold:focus {
      box-shadow: 0 0 20px rgba(212, 168, 71, 0.3);
    }

      font-family: 'VT323', monospace;
      font-size: 20px;
      background: #0a0e0a;
      color: #00ff88;
      border: 4px solid #00ff88;
      padding: 12px 16px;
      outline: none;
      image-rendering: pixelated;
      width: 100%;
      appearance: none;
      cursor: pointer;
      min-height: 52px;
    }
    .pixel-select:focus {
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }
    .pixel-select option {
      background: #0a0e0a;
      color: #00ff88;
      padding: 8px;
    }

    .pixel-card {
      background: #0a0e0a;
      border: 4px solid #00ff88;
      box-shadow: 
        inset 0 0 0 2px #0a0e0a,
        0 0 0 2px #00ff88,
        4px 4px 0 0 rgba(0, 255, 136, 0.15);
      padding: 20px;
      image-rendering: pixelated;
      transition: all 0.2s ease;
    }
    .pixel-card:hover {
      box-shadow: 
        inset 0 0 0 2px #0a0e0a,
        0 0 0 2px #00ff88,
        8px 8px 0 0 rgba(0, 255, 136, 0.1);

      border-color: #d4a847;
      box-shadow: 
        inset 0 0 0 2px #0a0e0a,
        0 0 0 2px #d4a847,
        4px 4px 0 0 rgba(212, 168, 71, 0.15);
    }

    .pixel-text {
      font-family: 'Press Start 2P', monospace;
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
      letter-spacing: 2px;
    }

    .pixel-text-gold {
      color: #d4a847;
      text-shadow: 0 0 10px rgba(212, 168, 71, 0.3);
    }

    .pixel-text-muted {
      font-family: 'VT323', monospace;
      color: #008855;
      font-size: 18px;
    }

    .pixel-text-glow {
      font-family: 'Press Start 2P', monospace;
      color: #00ff88;
      text-shadow: 
        0 0 20px rgba(0, 255, 136, 0.5),
        0 0 40px rgba(0, 255, 136, 0.2);
      letter-spacing: 2px;
    }

    /* ===== PIXEL DIVIDER ===== */
    .pixel-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #006644;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      margin: 16px 0;
    }
    .pixel-divider::before,
    .pixel-divider::after {
      content: '';
      flex: 1;
      height: 2px;
      background: repeating-linear-gradient(90deg, #00ff88 0px, #00ff88 4px, transparent 4px, transparent 8px);
    }

    /* ===== PIXEL NAV ===== */
    .pixel-nav {
      border-top: 4px solid #00ff88;
      background: #0a0e0a;
    }
    .pixel-nav-item {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #006644;
      transition: all 0.15s ease;
      min-height: 56px;
      min-width: 56px;
    }
    .pixel-nav-item.active {
      color: #00ff88;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }
    .pixel-nav-item:hover {
      color: #d4a847;
    }

    /* ===== PIXEL HALO ===== */
    @keyframes pixel-pulse {
      0% { opacity: 0.7; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.7; transform: scale(0.95); }
    }
    .pixel-halo {
      animation: pixel-pulse 2s ease-in-out infinite;
    }

    /* ===== RESPONSIVO ===== */
    @media (max-width: 640px) {
      .pixel-btn { font-size: 9px; padding: 10px 16px; }
      .pixel-text { font-size: 13px; }
      .pixel-text-glow { font-size: 15px; }
      .pixel-input { font-size: 16px; }
      .pixel-select { font-size: 16px; }
    }

    /* ===== SAFE AREA ===== */
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
