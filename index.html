      --bg-secondary: #111827;
      --bg-card: #1a2332;
      --bg-card-hover: #243044;
      --bg-input: #0d1520;
      --text-primary: #e8edf5;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #2d3a4a;
      --accent: #10b981;
      --accent-dark: #059669;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #8b5cf6;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      --radius: 12px;
      --font-display: 'Space Grotesk', 'Atkinson Hyperlegible', 'Inter', sans-serif;
      --font-body: 'Atkinson Hyperlegible', 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    .font-display { font-family: var(--font-display); }
    .font-body { font-family: var(--font-body); }

    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; }

      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 14px;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-body);
      font-size: 14px;
    }
    .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 30px var(--accent-glow); }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 40px;
      font-family: var(--font-body);
      font-size: 14px;
    }
    .btn-secondary:hover { background: var(--bg-card-hover); }

    .input-modern {
      background: var(--bg-input);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-primary);
      width: 100%;
      min-height: 42px;
      transition: all 0.3s ease;
      font-family: var(--font-body);
      font-size: 14px;
    }
    .input-modern:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }

    .select-modern {
      background: var(--bg-input);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-primary);
      width: 100%;
      min-height: 42px;
      appearance: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 14px;
    }
    .select-modern:focus { outline: none; border-color: var(--accent); }

    .nav-modern {
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 4px 2px;
      flex: 1;
      color: var(--text-muted);
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      position: relative;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item.active::after {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 3px;
      background: var(--accent);
      border-radius: 0 0 4px 4px;
    }
    .nav-item:hover { color: var(--text-primary); }
    .nav-item .icon { font-size: 16px; margin-bottom: 2px; }

    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 0 0 4px 4px;
    }
    .stat-card.revenue::before { background: linear-gradient(90deg, #10b981, #34d399); }
    .stat-card.expense::before { background: linear-gradient(90deg, #ef4444, #f87171); }
    .stat-card.balance::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }

    .pendencia-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      transition: all 0.3s ease;

    .pendencia-item.pago .pendencia-nome { text-decoration: line-through; color: var(--text-muted); }

    .tab-btn {

      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;

      color: var(--text-muted);

      font-family: var(--font-body);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;

      border: 4px solid #d4af37;

    .login-title-custom {

      margin-bottom: 20px;
      letter-spacing: 2px;
      font-weight: 700;
      font-family: var(--font-display);
      font-size: 24px;
    }

    .login-google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 12px;
      border: 2px solid #d4af37;
      background: transparent;
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: var(--font-body);
      margin-top: 10px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);

    .login-google-btn:hover {
      background: rgba(16, 185, 129, 0.1);
      border-color: #10b981;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
      transform: scale(1.02);
    }
    .login-google-btn:active {
      transform: scale(0.95);
    }
    .login-google-btn img {
      width: 24px;
      height: 24px;
    }

    /* ===== ANIMAÇÕES GAMIFICADAS ===== */
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .pulse-glow { animation: pulse-glow 2s infinite; }

    .progress-track {
      width: 100%;
      height: 16px;
      background: var(--bg-input);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border-color);
    }
    .progress-fill {
      height: 100%;
      border-radius: 20px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
      background: linear-gradient(90deg, var(--accent), #f59e0b);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 6px;
      font-size: 10px;
      font-weight: bold;
      color: #000;
    }

    .streak-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(239,68,68,0.1));
      border: 1px solid rgba(245,158,11,0.4);
      color: var(--warning);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
    }

    .level-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .goal-icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    /* Checkbox customizado */
    .checkbox-modern {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      border-radius: 4px;
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      .stat-card { padding: 10px 12px; }
      .btn-primary { padding: 8px 16px; font-size: 13px; min-height: 36px; }
      .nav-item { font-size: 8px; min-height: 46px; }
      .nav-item .icon { font-size: 14px; }
      .input-modern { font-size: 14px; min-height: 38px; }
      .select-modern { font-size: 14px; min-height: 38px; }
      .tab-btn { font-size: 11px; padding: 6px 8px; }
      .login-logo-box img { max-width: 150px; }
      .login-title-custom { font-size: 20px; }
      .login-google-btn { font-size: 14px; padding: 12px 16px; }
      .checkbox-modern { width: 16px; height: 16px; }
    }
  </style>

  function formatCurrency(v) {
    if (v === undefined || v === null || isNaN(v)) v = 0;
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
  }

  function parseCurrency(str) {
    if (!str) return 0;
    var clean = str.replace(/[R$\s]/g, '').replace(/\./g, '').replace(/,/g, '.');
    var num = parseFloat(clean);
    return isNaN(num) ? 0 : num;
  }

  function formatDate(dateStr) {

  }

  // ============================================

  function computeMonthlyAverage(economias) {
    var map = {};
    economias.forEach(function(e) {
      var k = monthKey(e.data);
      map[k] = (map[k] || 0) + Number(e.valor);
    });
    var keys = Object.keys(map);
    if (keys.length === 0) return 0;
    var total = keys.reduce(function(acc, k) { return acc + map[k]; }, 0);

  }

    var map = {};

    var streak = 0;
    var cursor = new Date();

      var k = cursor.getFullYear() + '-' + String(cursor.getMonth() + 1).padStart(2, '0');
      if (map[k]) { streak++; cursor.setMonth(cursor.getMonth() - 1); }
      else break;
    }
    return streak;
  }

  function levelInfo(pct) {

      var d = new Date();
      d.setMonth(d.getMonth() + mesesRestantes);
