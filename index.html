      --bg-card-hover: #243044;
      --bg-input: #0d1520;
      --text-primary: #e8edf5;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #2d3a4a;
      --accent: #10b981;
      --accent-dark: #059669;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #8b5cf6;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      --radius: 16px;
      --font-display: 'Space Grotesk', 'Atkinson Hyperlegible', 'Inter', sans-serif;
      --font-body: 'Atkinson Hyperlegible', 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.7;
    }

    .font-display { font-family: var(--font-display); }
    .font-body { font-family: var(--font-body); }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; }

    .card-modern {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 20px;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-body);
      font-size: 15px;
    }
    .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 30px var(--accent-glow); }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.3s ease;
      min-height: 48px;
      font-family: var(--font-body);
      font-size: 15px;
    }
    .btn-secondary:hover { background: var(--bg-card-hover); }

    .input-modern {
      background: var(--bg-input);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      width: 100%;
      min-height: 48px;
      transition: all 0.3s ease;
      font-family: var(--font-body);
      font-size: 16px;
    }
    .input-modern:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }

      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      width: 100%;
      min-height: 48px;
      appearance: none;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 16px;

      border-top: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
    }
    .nav-item {

      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      flex: 1;
      padding: 8px 4px;
      color: var(--text-muted);
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      position: relative;

      top: -1px;
      left: 50%;
      transform: translateX(-50%);

      height: 3px;
      background: var(--accent);
      border-radius: 0 0 4px 4px;

      position: relative;

      left: 0;
      right: 0;
      height: 4px;

      border-radius: 12px;

      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      border: 2px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: var(--font-body);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab-btn.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }

    .extrato-scroll {
      max-height: 400px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .extrato-scroll::-webkit-scrollbar { width: 4px; }
    .extrato-scroll::-webkit-scrollbar-track { background: var(--bg-input); border-radius: 4px; }
    .extrato-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

    /* ===== ESTILOS DA TELA DE LOGIN ===== */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      padding: 20px;
    }
    .login-card-custom {
      background: #0a0e0a;
      padding: 40px 30px;
      border-radius: 20px;
      border: 2px solid #10b981;
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.15);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .login-logo-box { margin-bottom: 30px; }
    .login-logo-box img {
      width: 100%;
      max-width: 220px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 50%;
      border: 4px solid #d4af37;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    }

      color: #d4af37;
      margin-bottom: 25px;
      letter-spacing: 2px;
      font-weight: 700;
      font-family: var(--font-display);
    }
    .login-input-custom {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #10b981;
      background: #1a1a1a;
      color: #fff;
      outline: none;
      font-size: 16px;
      margin-bottom: 15px;
    }
    .login-input-custom:focus { border-color: #d4af37; box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }
    .login-btn-custom {
      width: 100%;
      padding: 14px;
      background: #10b981;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
      font-family: var(--font-body);
    }
    .login-btn-custom:hover { background: #059669; box-shadow: 0 0 15px #10b981; transform: scale(1.02); }
    .login-error-msg { color: #ef4444; font-size: 14px; margin-bottom: 10px; font-weight: bold; }
    .login-success-msg { color: #10b981; font-size: 14px; margin-bottom: 10px; font-weight: bold; }
    .login-toggle-text { color: #94a3b8; font-size: 14px; cursor: pointer; transition: 0.3s; background: transparent; border: none; margin-top: 10px; }
    .login-toggle-text:hover { color: #10b981; }
  </style>
</head>
